<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .handoff-box { border-left: 4px solid #198754; background: #e8f4ec; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container mt-5" style="max-width: 550px;">
    <div class="card shadow p-4 border-0">
        <h4 class="text-center mb-4 text-dark fw-bold">Secure Premium Checkout</h4>

        <div th:if="${finalPaymentId}" class="handoff-box mb-4">
            <h6 class="fw-bold text-success">Transaction Complete</h6>
            <p class="mb-2 text-muted" th:text="${successMessage}"></p>
            <ul class="mb-3 small">
                <li><strong>Payment ID:</strong> <span th:text="${finalPaymentId}"></span></li>
                <li><strong>Status:</strong> <span th:text="${finalStatus}"></span></li>
            </ul>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div th:unless="${finalPaymentId}">
            <form th:action="@{/payment/initiate}" th:object="${paymentForm}" method="post">
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label small fw-bold text-muted">Policy ID</label>
                        <input type="number" class="form-control bg-light" th:field="*{policyId}" readonly>
                    </div>
                    <div class="col">
                        <label class="form-label small fw-bold text-muted">Amount Due (₹)</label>
                        <input type="number" step="0.01" min="1" class="form-control bg-light" th:field="*{amount}">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold">Email for E-Receipt</label>
                    <input type="email" class="form-control" th:field="*{userEmail}" required>
                </div>

                <button type="submit" class="btn btn-dark w-100 fw-bold">Initialize Razorpay</button>
            </form>

            <form th:action="@{/payment/success}" method="post" id="hiddenForm">
                <input type="hidden" name="policyId" th:value="${paymentForm.policyId}">
                <input type="hidden" name="userEmail" th:value="${paymentForm.userEmail}">
                <input type="hidden" name="amount" th:value="${paymentForm.amount}">
                <input type="hidden" name="transactionId" id="hiddenTxnId">
            </form>
        </div>

    </div>
</div>

<script th:inline="javascript" th:if="${triggerCheckout}">
    /*<![CDATA[*/
    var options = {
        "key": "rzp_test_StHEs6fwjcX5c0",
        "amount": /*[[${paymentForm.amount * 100}]]*/ 0,
        "currency": "INR",
        "name": "Vehicle Insurance Mgt",
        "order_id": /*[[${orderId}]]*/ '',
        "handler": function (response) {
            document.getElementById('hiddenTxnId').value = response.razorpay_payment_id;
            // The JavaScript automatically triggers the POST to /payment/success
            document.getElementById('hiddenForm').submit();
        },
        "theme": { "color": "#212529" }
    };
    var rzp = new Razorpay(options);
    rzp.open();
    /*]]>*/
</script>

</body>
</html>
