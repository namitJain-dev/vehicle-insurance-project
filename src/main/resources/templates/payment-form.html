<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Policy Payment Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow p-4">
        <h3 class="text-center mb-4 text-primary">Pay Insurance Premium</h3>

        <div th:if="${successMessage}" class="alert alert-success">
            <span th:text="${successMessage}"></span><br>
            <strong th:text="'Ref: ' + ${transactionId}"></strong>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/payment/initiate}" th:object="${paymentForm}" method="post">
            <div class="mb-3">
                <label>Policy ID</label>
                <input type="number" class="form-control" th:field="*{policyId}" required>
            </div>
            <div class="mb-3">
                <label>Email (For Receipt)</label>
                <input type="email" class="form-control" th:field="*{userEmail}" required>
            </div>
            <div class="mb-3">
                <label>Premium Amount (₹)</label>
                <input type="number" class="form-control" th:field="*{amount}" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Proceed to Pay</button>
        </form>

        <form th:action="@{/payment/success}" method="post" id="hiddenForm">
            <input type="hidden" name="policyId" th:value="${paymentForm.policyId}">
            <input type="hidden" name="userEmail" th:value="${paymentForm.userEmail}">
            <input type="hidden" name="amount" th:value="${paymentForm.amount}">
            <input type="hidden" name="transactionId" id="hiddenTxnId">
        </form>

    </div>
</div>

<script th:inline="javascript" th:if="${triggerCheckout}">
    /*<![CDATA[*/
    var options = {
        "key": "rzp_test_StHEs6fwjcX5c0",
        "amount": /*[[${paymentForm.amount * 100}]]*/ 0,
        "currency": "INR",
        "name": "Vehicle Insurance",
        "order_id": /*[[${orderId}]]*/ '',
        "handler": function (response) {
            // Put the receipt ID in the hidden form and submit it
            document.getElementById('hiddenTxnId').value = response.razorpay_payment_id;
            document.getElementById('hiddenForm').submit();
        },
        "theme": { "color": "#0d6efd" }
    };
    var rzp = new Razorpay(options);
    rzp.open();
    /*]]>*/
</script>

</body>
</html>
