spring.application.name=customermanagement
# 1. The Database URL (Where does it live?)
spring.datasource.url=jdbc:mysql://localhost:3306/vims

# 2. Database Credentials
spring.datasource.username=yourusername
spring.datasource.password=yourpassword
server.port=8082

# 3. Spring Data JPA Settings
# This magic line tells Spring to automatically create the database tables based on our Java code!
spring.jpa.hibernate.ddl-auto=update
# Show the SQL queries in the console so we can see what's happening behind the scenes
spring.jpa.show-sql=true
